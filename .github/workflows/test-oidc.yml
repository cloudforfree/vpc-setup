name: OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-aws:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::490382082074:role/gha-vpc-lab # Replace with your actual IAM role name
          aws-region: us-east-1

      - name: Verify Identity
        run: aws sts get-caller-identity