name: Terraform deploy

on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/terraform-deploy.yml"]
  push:
    branches: [master]
    paths: ["terraform/**", ".github/workflows/terraform-deploy.yml"]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC to AWS
  contents: read

concurrency:
  group: terraform-vpc-lab
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_VAR_allowed_ssh_cidr: ${{ vars.ALLOWED_SSH_CIDR }}
  TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}

defaults:
  run:
    working-directory: ./infra

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=vpc-lab/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -out=tfplan

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # environment: production   # add required reviewers in repo settings for a manual approval gate
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=vpc-lab/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Apply
        run: terraform apply -input=false -auto-approve

      - name: Show outputs
        run: terraform output
